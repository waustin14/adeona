[project]
name = "adeona"
version = "0.1.0"
description = "Read-only flight research assistant that ranks options by effective cost"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "mcp>=2.3,<3"]

[project.scripts]
adeona = "adeona.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adeona = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
